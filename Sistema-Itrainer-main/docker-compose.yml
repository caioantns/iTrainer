services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: itrainer_user
      POSTGRES_PASSWORD: dev-pg-pass
      POSTGRES_DB: itrainer
    ports:
      - "5432:5432"
    volumes:
      - itrainer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itrainer_user -d itrainer"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  itrainer_pgdata:
